# Source checkouts only (not shipped to image installs): builds Omicron's images
# from this working tree. Add it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# It isn't named docker-compose.override.yml, so that name stays yours: Compose
# loads that one on its own, on every engine, for your instance's own settings.
services:
  backend:
    # From the repository root, so the image can include the API contract (packages/contract).
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
  frontend:
    build: ./apps/frontend
  backup:
    build: ./backup
