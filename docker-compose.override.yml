# Source checkouts only (not shipped to image installs): builds Omicron's images
# from this working tree. Compose loads this file automatically next to
# docker-compose.yml, so `docker compose up -d --build` runs your local code.
services:
  backend:
    # From the repository root, so the image can include the API contract (packages/contract).
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
  frontend:
    build: ./apps/frontend
  backup:
    build: ./backup
