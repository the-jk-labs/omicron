nodeLinker: hoisted
saveExact: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: "no-downgrade"
trustPolicyExcludePrune: true
allowBuilds:
  msgpackr-extract: true
  unrs-resolver: true
trustPolicyExclude:
  - semver@6.3.1
  - expo
  - expo-*
  - babel-preset-expo
  - "@expo/*"
minimumReleaseAgeExclude:
  - expo-better-auth-passkey@1.7.0
  - tailwindcss@4.3.5
  - "@expo/cli@58.1.21"
  - "@expo/metro-config@58.0.23"
  - "@expo/router-server@58.0.23"
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
  - "@expo/ui@58.0.29"
  - expo-dev-client@58.0.21
  - expo-dev-launcher@58.0.21
  - expo-router@58.0.32
  - expo-web-browser@58.1.0
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS with no patched release; it only matches build/test tooling globs. Drop once fixed.
    - GHSA-fc5q-39xc-vjpf
