# Continuous integration. Runs the checks that already exist as local tasks on
# every push and PR, so a typecheck, lint, or test regression can't land on
# `main` and reach self-hosters on their next `git pull && docker compose up`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (check · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        run: deno task check
      - name: Lint
        run: deno lint
      # The frontend job already enforces its own formatting (greenly runs
      # `pnpm fmt:check`); the backend had no equivalent gate, so a file could —
      # and did — sit unformatted on main indefinitely.
      - name: Format
        run: deno fmt --check
      - name: Test
        run: deno task test
      - name: Audit dependencies
        # Surface every advisory in the log for visibility, then fail only on a
        # high/critical one — so a serious CVE in a dependency blocks the merge,
        # while an unfixable low can't wedge the pipeline. Runs against the deps
        # the steps above already resolved.
        run: |
          deno audit || true
          deno audit --level=high

  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json
          version: 11.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in step with apps/frontend/Dockerfile, so CI checks the same
          # Node major that the runtime image ships.
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The typecheck reads the backend's serializers to prove this app's API
      # types still match them (apps/frontend/src/lib/api/contract.ts), so it
      # resolves the backend's own npm dependencies — drizzle-orm above all,
      # which every `db/schema.ts` type flows from. Deno materializes them into
      # apps/backend/node_modules (`nodeModulesDir: auto` in deno.json). Without
      # this step svelte-check fails with 45 "Cannot find module 'drizzle-orm'"
      # errors on backend source, none of which are the frontend's fault.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install backend dependencies (for the cross-app typecheck)
        working-directory: apps/backend
        run: deno install

      - name: Run Checks
        run: pnpm check

      - name: Audit dependencies
        # Same policy as the backend: print all advisories, fail only on
        # high/critical. `--prod` ignores devDependencies (build-time only, not
        # shipped in the runtime image).
        run: |
          pnpm audit --prod || true
          pnpm audit --prod --audit-level high

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The compose stack builds both images from source (no prebuilt images
      # yet), so a broken Dockerfile breaks `install.sh` for everyone. Build both
      # here to catch it before release.
      - name: Build backend image
        run: docker build -t omicron-backend ./apps/backend
      - name: Build frontend image
        run: docker build -t omicron-frontend ./apps/frontend
