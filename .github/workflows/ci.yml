# Continuous integration. Runs the checks that already exist as local tasks on
# every push and PR, so a typecheck, lint, or test regression can't land on
# `main` and reach self-hosters on their next `git pull && docker compose up`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (check · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    # A throwaway Postgres for the integration suite. The unit tests need no
    # database; the visibility rules live in SQL predicates, which nothing can
    # assert on without one — which is how #41 and the five gaps in #55 all
    # reached main. Scrapped with the runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omicron
          POSTGRES_PASSWORD: omicron
          POSTGRES_DB: omicron_test
        ports:
          - 5432:5432
        # Steps start as soon as the container is up, which is before Postgres
        # is accepting connections; without a healthcheck the first test races
        # the server and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U omicron -d omicron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node only runs the tooling here (the app runs on Deno). The tests need
          # a built-in Temporal, as Deno has: Node 26 ships it, Node 24 doesn't.
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            apps/backend/pnpm-lock.yaml
            packages/contract/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The API contract (packages/contract), linked into this app; its own install brings zod.
      - name: Install the API contract
        working-directory: packages/contract
        run: pnpm install --frozen-lockfile

      # Independent of each other once installed; one failing still fails the job.
      - parallel:
          - name: Run Checks
            run: pnpm check

          # Runs the committed migrations against the service container above, then
          # asserts on who can see what. Every case is a leak that shipped.
          - name: Integration tests (visibility)
            env:
              DATABASE_URL: postgres://omicron:omicron@localhost:5432/omicron_test
              SESSION_SECRET: ci-integration-test-secret-not-a-real-key
            run: pnpm test:integration

          - name: Audit dependencies
            # Surface every advisory in the log for visibility, then fail only on a
            # high/critical one — so a serious CVE in a dependency blocks the merge,
            # while an unfixable low can't wedge the pipeline. Runs against the deps
            # the install above already resolved.
            run: |
              pnpm audit || true
              pnpm audit --audit-level high

  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in step with apps/frontend/Dockerfile, so CI checks the same
          # Node major that the runtime image ships.
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/frontend/pnpm-lock.yaml
            packages/contract/pnpm-lock.yaml

      - parallel:
          - name: Install
            run: pnpm install --frozen-lockfile

          # The API types come from the contract (packages/contract); its own install brings zod.
          - name: Install the API contract
            working-directory: packages/contract
            run: pnpm install --frozen-lockfile

      - parallel:
          - name: Run Checks
            run: pnpm check

          - name: Audit dependencies
            # Same policy as the backend: print all advisories, fail only on
            # high/critical. `--prod` ignores devDependencies (build-time only, not
            # shipped in the runtime image).
            run: |
              pnpm audit --prod || true
              pnpm audit --prod --audit-level high

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The compose stack builds both images from source (no prebuilt images
      # yet), so a broken Dockerfile breaks `install.sh` for everyone. Build both
      # here to catch it before release.
      - parallel:
          - name: Build backend image
            run: docker build -t omicron-backend -f apps/backend/Dockerfile .
          - name: Build frontend image
            run: docker build -t omicron-frontend ./apps/frontend

  mobile:
    name: Mobile (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/mobile/package.json
          version: 12.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the Node that eas.json builds with.
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/mobile/pnpm-lock.yaml
            packages/contract/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The API contract (packages/contract), linked into this app; its own install brings zod.
      - name: Install the API contract
        working-directory: packages/contract
        run: pnpm install --frozen-lockfile

      - parallel:
          # TypeScript, oxfmt, oxlint, Vitest and the asset check (greenly.config.ts).
          - name: Run Checks
            run: pnpm check

          # Native modules must match the Expo SDK, or a dev build breaks in ways
          # no unit test sees.
          - name: Expo dependency check
            run: pnpm expo install --check

          - name: Audit dependencies
            # Same policy as the other apps: print all advisories, fail only on
            # high/critical.
            run: |
              pnpm audit --prod || true
              pnpm audit --prod --audit-level high

  mobile-react-doctor:
    name: Mobile (React Doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@v2
        with:
          directory: apps/mobile
          comment: false
